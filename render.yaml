services:
  - type: web
    name: your-backend-name
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
